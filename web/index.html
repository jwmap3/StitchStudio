<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Stitch Studio</title>
<style>
:root{
  --bg:#16181d; --panel:#1f2229; --panel2:#272b34; --line:#343945; --text:#eef0f4; --muted:#9aa3b2;
  --accent:#f2b134; --accent-ink:#1b1400; --danger:#e5484d; --ok:#3fb950;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.ib:active{background:var(--panel2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib[disabled]{opacity:.35}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0f1115}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,22,27,.88);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);pointer-events:none;max-width:92%;text-align:center}
#hint:empty{display:none}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--text);color:#111;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#sheet{flex:none;background:var(--panel);border-top:1px solid var(--line);max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#sheet:empty{display:none}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:0 0 108px;color:var(--muted);font-size:14px}
.row input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.row .val{flex:0 0 58px;text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:500;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.danger{color:#ff8a8d}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
input[type=text],input[type=number],select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px;width:100%}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{padding:8px 12px;min-height:38px}
.toggle button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.swc{position:relative;overflow:hidden}
.swc input{position:absolute;inset:-6px;opacity:0;width:60px;height:60px}
nav{flex:none;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:4px 2px calc(4px + var(--safe-b))}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:11px;color:var(--muted)}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.layer{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}
.layer.on{background:var(--panel2)}
.layer .dot{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.2)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .meta{color:var(--muted);font-size:12.5px}
.small{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#menu.open{display:block}
#menu .panel{position:absolute;left:0;top:0;bottom:0;width:min(330px,86vw);background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0}
#menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;text-align:left;font-size:15.5px}
#menu .mi:active{background:var(--panel2)}
#menu .mi svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
#menu .brand{padding:6px 18px 14px;font-weight:700;font-size:18px}
#menu .brand span{color:var(--accent)}
#menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:30;color:#fff;font-weight:600}
#busy.on{display:grid}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title" id="title">Stitch Studio</div>
    <button class="ib" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ib" id="bFit" aria-label="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="bPreview" aria-label="Realistic preview"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="hint"></div><div id="toast"></div></div>
  <div id="sheet"></div>
  <nav id="tools">
    <button data-tool="select"><svg viewBox="0 0 24 24"><path d="m5 3 14 8-6 2-3 6z"/></svg>Select</button>
    <button data-tool="pick"><svg viewBox="0 0 24 24"><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L16 10l-2-2z"/><path d="m14 8-8.5 8.5L5 19l2.5-.5L16 10"/><path d="m12.5 6.5 5 5"/></svg>Pick</button>
    <button data-tool="brush"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-8.5 8.5a3 3 0 0 1-2 .9L4 20l.6-5.5a3 3 0 0 1 .9-2z"/><path d="m12 6 6 6" opacity=".6"/></svg>Brush</button>
    <button data-tool="draw"><svg viewBox="0 0 24 24"><path d="M4 18 8 5l8 2 4 10z"/><circle cx="8" cy="5" r="1.6"/><circle cx="16" cy="7" r="1.6"/><circle cx="20" cy="17" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg>Draw</button>
    <button data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <button data-tool="auto"><svg viewBox="0 0 24 24"><path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="m18 15 .9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>Auto</button>
    <button data-tool="layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Layers</button>
  </nav>
</div>

<div id="menu"><div class="panel">
  <div class="brand">Stitch<span>Studio</span></div>
  <button class="mi" data-act="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>Open image to trace</button>
  <button class="mi" data-act="imgsize"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-3 2 2 3-4 3 5"/></svg>Image size (inches) &amp; position</button>
  <button class="mi" data-act="size"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16" opacity=".5"/></svg>Design size &amp; hoop (inches)</button>
  <hr>
  <button class="mi" data-act="vp3"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>Export VP3 (Husqvarna / Pfaff)</button>
  <button class="mi" data-act="dst"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>Export DST (Tajima)</button>
  <hr>
  <button class="mi" data-act="save"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Save project</button>
  <button class="mi" data-act="open"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Open project</button>
  <button class="mi" data-act="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New design</button>
  <hr>
  <button class="mi" data-act="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17.5v.01"/></svg>How to use</button>
</div></div>
<div id="busy">Working…</div>
<input type="file" id="fImage" accept="image/*" hidden>
<input type="file" id="fProject" accept=".json,.stitch,application/json" hidden>

<script src="js/stitch.js"></script>
<script src="js/trace.js"></script>
<script src="js/app.js"></script>
</body>
</html>
